name: Team Bulls security

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Security regression checks
        run: |
          node scripts/security-check.mjs
          node scripts/exercise-ownership-rules-check.mjs
          node scripts/report-submit-contract-check.mjs
          node scripts/weekly-report-integrity-check.mjs
          node scripts/production-audit-check.mjs
