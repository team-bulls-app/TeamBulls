name: Photo quality and download

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  photo-quality-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate original photo preservation and trainer download
        run: |
          node scripts/photo-quality-download-check.mjs
          node scripts/report-submit-contract-check.mjs
