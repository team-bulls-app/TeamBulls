name: Validar Team Bulls
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Executar validação estática
        run: |
          node scripts/production-audit-check.mjs
          node scripts/report-submit-contract-check.mjs
          node scripts/weekly-report-integrity-check.mjs
          node scripts/mobile-startup-consistency-check.mjs
          node scripts/heic-worker-export-check.mjs
          node scripts/pdf-export-check.mjs
          node scripts/technique-composition-integrity-check.mjs
          node scripts/student-home-profile-check.mjs
          node testes/testar_cadastro_convite_v10_10_9.js
