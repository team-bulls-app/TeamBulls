name: Team Bulls quality

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  static-regression-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Team Bulls regression checks
        run: |
          node scripts/quality-check.mjs
          node scripts/prescription-propagation-check.mjs
          node scripts/diet-deletion-check.mjs
          node scripts/student-guidance-check.mjs
          node scripts/session-performance-check.mjs
          node scripts/week-selection-check.mjs
          node scripts/usability-check.mjs
          node scripts/legacy-student-link-check.mjs
          node scripts/trainer-student-list-check.mjs
          node scripts/workflow-controls-check.mjs
          node scripts/report-usability-audit-check.mjs
