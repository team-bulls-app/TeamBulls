name: Team Bulls quality

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  static-regression-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Team Bulls regression checks
        run: |
          node scripts/quality-check.mjs
          node scripts/prescription-propagation-check.mjs
          node scripts/diet-deletion-check.mjs
          node scripts/student-guidance-check.mjs
          node scripts/session-performance-check.mjs
          node scripts/week-selection-check.mjs
          node scripts/session-integrity-check.mjs
          node scripts/usability-check.mjs
          node scripts/button-action-integrity-check.mjs
          node scripts/legacy-student-link-check.mjs
          node scripts/trainer-student-list-check.mjs
          node scripts/workflow-controls-check.mjs
          node scripts/report-usability-audit-check.mjs
          node scripts/firestore-read-baseline-check.mjs
          node scripts/diet-calculation-evolution-check.mjs
          node scripts/diet-portion-presets-check.mjs
          node scripts/diet-copy-check.mjs
          node scripts/pdf-export-check.mjs
          node scripts/destructive-actions-supply-check.mjs
          node scripts/pending-session-mutations-check.mjs
          node scripts/startup-runtime-light-check.mjs
          node scripts/session-recovery-home-dates-check.mjs
          node scripts/student-request-realtime-check.mjs
          node scripts/student-weekly-report-entry-check.mjs
          node scripts/trainer-sent-reports-check.mjs
          node scripts/trainer-feedback-archive-check.mjs
          node scripts/trainer-overdue-report-status-check.mjs
          node scripts/loader-retry-check.mjs
          node scripts/production-audit-check.mjs
          node scripts/trainer-workflow-v10_10_11-check.mjs
          node scripts/mobile-startup-consistency-check.mjs
          node scripts/mobile-session-runtime-stability-check.mjs
          node scripts/diet-live-calories-check.mjs
          node scripts/trainer-inbox-payments-check.mjs
          node scripts/student-home-rescue-check.mjs
          node scripts/student-hotbar-payments-check.mjs
          node scripts/student-supply-options-header-check.mjs
          node scripts/student-diet-compact-live-check.mjs
          node scripts/student-diet-layout-check.mjs
          node scripts/student-workout-library-check.mjs
          node scripts/weekly-report-access-check.mjs
          node scripts/startup-cache-recovery-check.mjs
          node scripts/mobile-touch-freeze-check.mjs
          node scripts/runtime-stabilization-check.mjs
          node testes/testar_cadastro_convite_v10_10_9.js
